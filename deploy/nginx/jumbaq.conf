# jumbaq on the server. Mounted as /etc/nginx/conf.d, so this is inside the http block of
# the image's nginx.conf. 00-cloudflare.conf (real client IP, $is_from_cloudflare) is
# loaded before this file.
#
# Cloudflare: DNS record api.jumbaq.fun proxied (orange cloud), SSL/TLS mode Full (strict),
# "Always Use HTTPS" on. The certificate is a Cloudflare Origin CA certificate for
# jumbaq.fun and *.jumbaq.fun, put on the server by hand:
#   /root/jumbaq/deploy/ssl/origin.pem       certificate
#   /root/jumbaq/deploy/ssl/origin-key.pem   private key (chmod 600)
#
# Zone-level Authenticated Origin Pulls: Cloudflare shows our own client certificate, so a
# request from another Cloudflare account, which passes the IP check, is still refused. The
# global AOP certificate is shared by every account and would not stop it. Made once on a
# laptop, outside the repository:
#   openssl genrsa -aes256 -out rootca.key 4096
#   openssl req -x509 -new -key rootca.key -sha256 -days 1826 -subj "/CN=jumbaq.fun" -out rootca.crt
#   openssl req -new -nodes -newkey rsa:4096 -subj "/CN=api.jumbaq.fun" -keyout cert.key -out cert.csr
#   printf 'basicConstraints=CA:FALSE\n' > cert.v3.ext
#   openssl x509 -req -in cert.csr -CA rootca.crt -CAkey rootca.key -CAcreateserial \
#     -days 730 -sha256 -extfile cert.v3.ext -out cert.crt
# cert.crt and cert.key go to Cloudflare (SSL/TLS, Origin Server, Authenticated Origin Pulls,
# Zone-level), then the toggle there goes on. rootca.crt goes to the server:
#   /root/jumbaq/deploy/ssl/origin-pull-ca.pem
# Keep rootca.key offline: it signs the next client certificate in two years.

# Keep the request id from the client, or make a new one. The API logs it on every line.
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ""      $request_id;
}

log_format jumbaq '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent '
                  '$request_time cf_ray=$http_cf_ray req_id=$req_id';

server_tokens off;

# `proxied any`: requests from Cloudflare carry a Via header, and nginx does not compress
# those by default.
gzip on;
gzip_proxied any;
gzip_vary on;
gzip_min_length 1024;
gzip_types application/json text/plain text/css application/javascript;

limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
# Every setup makes a family, so a script must not fill the database.
limit_req_zone $binary_remote_addr zone=setup:10m rate=10r/m;

ssl_certificate     /etc/nginx/ssl/origin.pem;
ssl_certificate_key /etc/nginx/ssl/origin-key.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# Docker DNS. With `resolve`, nginx follows the api to its new address when Luxen
# recreates the container, so a deploy needs no nginx restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# nginx answers a rate-limited request itself, so the API's CORS headers are missing, and
# without these the browser hides the 429. Keep it equal to JUMBAQ_CORS_ORIGINS.
map $http_origin $cors_origin {
    default "";
    "https://jumbaq.fun" $http_origin;
}

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 16;
}

# Unknown host or the raw IP of the server: refuse the TLS handshake, so a scanner does
# not even get the certificate. Cloudflare always sends the name (SNI).
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.jumbaq.fun;

    access_log /dev/stdout jumbaq;

    ssl_client_certificate /etc/nginx/ssl/origin-pull-ca.pem;
    ssl_verify_client on;

    # Only Cloudflare may reach the origin. The check uses the address of the connection,
    # not the client IP that 00-cloudflare.conf takes from CF-Connecting-IP.
    if ($is_from_cloudflare = 0) {
        return 403;
    }

    client_max_body_size 64k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=per_ip burst=40 nodelay;
    limit_req_status 429;
    error_page 429 = @too_many_requests;

    # The same JSON error as the API. add_header here replaces the server's ones, so the
    # security headers are repeated.
    location @too_many_requests {
        default_type application/json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "Retry-After" always;
        add_header Vary "Origin" always;
        add_header Retry-After "60" always;
        return 429 '{"error":{"code":"common.too_many_requests","request_id":"$req_id","message":"Too many requests. Try again in a minute."}}';
    }

    location = /api/v1/families {
        limit_req zone=setup burst=10 nodelay;
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    location /api/ {
        proxy_pass http://api;
        include /etc/nginx/conf.d/proxy.inc;
    }

    # Only the API lives on this host. Docs: /api/v1/docs
    location / {
        return 404;
    }
}
