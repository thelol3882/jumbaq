# =============================================================================
# Cloudflare trusted proxies + real-IP + access gate
# =============================================================================
# - set_real_ip_from:  trust CF edge IPs; rewrite $remote_addr from the
#                      CF-Connecting-IP header so the app sees the visitor's IP.
# - geo $is_from_cloudflare on $realip_remote_addr: checks the original
#                      connection IP (= CF edge), before the real_ip rewrite.
#                      Server blocks then `if ($is_from_cloudflare = 0) return 403;`
#                      to drop anything that didn't come through Cloudflare.
#
# Check now and then that the lists match the sources below.
# IP sources: https://www.cloudflare.com/ips-v4/ and /ips-v6/
# =============================================================================

# --- Trust CF edge, rewrite real client IP ----------------------------------
# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# --- Whitelist: 0 = not from CF, 1 = from CF --------------------------------
geo $realip_remote_addr $is_from_cloudflare {
    default 0;
    # IPv4
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    # IPv6
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}
