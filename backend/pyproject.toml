[project]
name = "jumbaq"
version = "0.1.0"
description = "jumbaq backend: API and worker"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.143",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.15",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.32",
    "arq>=0.28",
    "redis>=5",
    "alembic>=1.20",
    "anthropic>=2.8.0",
    "stripe>=17.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.17",
    "import-linter>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jumbaq"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `make test` also runs the integration tests.
addopts = "-m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs PostgreSQL and Redis (run `make up` first)",
]
